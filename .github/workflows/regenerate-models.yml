# Reusable workflow: regenerate a client's models from the schema its reference
# deployment serves, and open a pull request when they changed.
#
#   on:
#     schedule: [{cron: "23 6 * * *"}]
#     workflow_dispatch:
#   permissions:
#     contents: write
#     pull-requests: write
#   jobs:
#     regenerate:
#       if: vars.SPEC_URL != ''
#       uses: vexxhost/python-clientcore/.github/workflows/regenerate-models.yml@v0.1.0
#       with:
#         service: budget
#         spec-url: ${{ vars.SPEC_URL }}
#         output: budgetclient/v1/models.py
name: regenerate-models
on:
  workflow_call:
    inputs:
      service:
        description: Service name recorded in the generated header, e.g. budget.
        required: true
        type: string
      spec-url:
        description: The reference deployment's /openapi-3.0.yaml.
        required: true
        type: string
      output:
        description: Path of the generated models module.
        required: true
        type: string
permissions:
  contents: write
  pull-requests: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: step-security/setup-uv@e2eb4db858a6e128febbb7954cb46cb8b1f1e1d3 # v10.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[test]'
      - run: python -m vexxhost_clientcore.codegen --service "$SERVICE" --spec "$SPEC_URL" --output "$OUTPUT"
        env:
          SERVICE: ${{ inputs.service }}
          SPEC_URL: ${{ inputs.spec-url }}
          OUTPUT: ${{ inputs.output }}
      - run: pytest
      - uses: step-security/create-pull-request@50c103da2b9ca12cd5bc013fc6931051a5aa872b # v8.1.1
        with:
          branch: regenerate/schema
          signoff: true
          commit-message: Regenerate models from the served ${{ inputs.service }} schema
          title: Regenerate models from the served ${{ inputs.service }} schema
          body: |
            Regenerating from ${{ inputs.spec-url }} changed `${{ inputs.output }}`. `SPEC_VERSION` names the ${{ inputs.service }} build it came from.

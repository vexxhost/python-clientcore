# Reusable test workflow for VEXXHOST API clients built on vexxhost-clientcore.
#
#   jobs:
#     test:
#       uses: vexxhost/python-clientcore/.github/workflows/python-client-ci.yml@v0.1.0
#       with:
#         smoke-command: openstack budget list --help
name: python-client-ci
on:
  workflow_call:
    inputs:
      smoke-command:
        description: A command that proves the OpenStack CLI loads the plugin.
        required: true
        type: string
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test]' build ruff
      - run: ruff check .
      - run: pytest
      - run: python -m build
      - run: ${{ inputs.smoke-command }}
